name: camagru

services:
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    ports:
      - "80:80"
    networks:
      - app_net

  camagru-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - camagru-pg:/var/lib/postgresql/data
    networks:
      - app_net

volumes:
  camagru-pg:

networks:
  app_net:
    driver: bridge