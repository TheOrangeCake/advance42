[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "llm-sdk",
    "numpy>=2.5.4",
    "pydantic>=2.14.0",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
